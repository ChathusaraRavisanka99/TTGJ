services:
  postgres:
    image: postgres:16-alpine
    container_name: ratnavue-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ratnavue
      POSTGRES_PASSWORD: ratnavue
      POSTGRES_DB: ratnavue
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
